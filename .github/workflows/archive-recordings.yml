name: Archive recordings (free forever)

# VAPI free retention ~14 days — cron kept as late as safely possible (weekly).
# Near-immediate archive still happens via webhook / Pull button (repository_dispatch).
# When this job pushes to main, Vercel auto-redeploys (Root Directory = web) so archive audio goes live.
on:
  schedule:
    # Once a week: Sunday 03:15 UTC (~08:15 PKT). Max practical delay before 14-day VAPI expiry.
    - cron: "15 3 * * 0"
  workflow_dispatch:
  repository_dispatch:
    types: [archive-recordings]
  push:
    paths:
      - "scripts/archive-recordings.js"
      - ".github/workflows/archive-recordings.yml"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    # Hard cap — hung VAPI downloads must not burn a 6h Actions slot
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Prefer owner PAT so archive commits are authored as rohaan2802
          token: ${{ secrets.ARCHIVE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No fixed 45s sleep — script retries only if recordings are still pending.
      - name: Sync archive from VAPI (fast)
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          ARCHIVE_MAX_PAGES: ${{ github.event_name == 'schedule' && '3' || '2' }}
          ARCHIVE_FAST: "1"
          ARCHIVE_RETRY_WAITS: ${{ github.event_name == 'schedule' && '' || '8,12' }}
          ARCHIVE_HTTP_TIMEOUT_MS: "25000"
        run: node scripts/archive-recordings.js

      - name: Commit archive if changed
        env:
          GIT_AUTHOR_NAME: rohaan2802
          GIT_AUTHOR_EMAIL: m.rohaanarshad@gmail.com
          GIT_COMMITTER_NAME: rohaan2802
          GIT_COMMITTER_EMAIL: m.rohaanarshad@gmail.com
        run: |
          git config user.name "rohaan2802"
          git config user.email "m.rohaanarshad@gmail.com"
          # porcelain is much faster than diff/add on the whole audio tree
          CHANGED="$(git status --porcelain -- web/public/call-archive || true)"
          if [ -z "$CHANGED" ]; then
            echo "No archive changes"
            exit 0
          fi
          echo "$CHANGED"
          # Stage only paths that actually changed
          echo "$CHANGED" | awk '{print substr($0,4)}' | while IFS= read -r f; do
            [ -n "$f" ] || continue
            git add -- "$f" || true
          done
          if git diff --staged --quiet; then
            echo "No staged archive changes"
          else
            git commit -m "chore: archive call recordings (free permanent storage)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
